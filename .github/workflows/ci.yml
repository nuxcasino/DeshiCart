name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Production build. Pages are force-dynamic and the sitemap degrades
      # gracefully, so no live database is needed — the module-load guard
      # only requires DATABASE_URL to be *set*. Schema sync on Vercel is
      # handled separately by the `vercel-build` script.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ci_db
